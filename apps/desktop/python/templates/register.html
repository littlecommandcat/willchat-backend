<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WillChat | 註冊</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #000;
        }

        .auth-body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-form {
            width: 300px;
            padding: 30px;
            border: 1px solid #000;
            border-radius: 8px;
        }

        .auth-form h2 {
            text-align: center;
            margin-top: 0;
        }

        .auth-form label {
            display: block;
            margin-top: 15px;
        }

        .auth-form input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border: 1px solid #aaa;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .auth-form button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #000;
            color: #fff;
            border: 1px solid #000;
            border-radius: 4px;
            cursor: pointer;
        }

        .auth-form button:hover {
            background: #333;
        }

        .auth-form button:disabled {
            background: #777;
            cursor: not-allowed;
        }

        .auth-form p {
            text-align: center;
            font-size: 14px;
            margin-bottom: 0;
        }

        .auth-form a {
            color: #000;
        }

        .auth-message {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="auth-body">
        <form id="registerForm" class="auth-form">
            <h2>建立帳號</h2>

            <label for="username">帳號</label>
            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                minlength="3"
                required
            >

            <label for="email">電子郵件</label>
            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
            >

            <label for="password">密碼</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <label for="confirm_password">確認密碼</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <button type="submit" id="registerButton">註冊</button>

            <p>已有帳號？<a href="index.html">返回登入</a></p>

            <p id="message" class="auth-message" role="status"></p>
        </form>
    </div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="status.js"></script>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        const errorCodeMap = {
            "email_already_registered": "此 Email 已註冊"
        };

        function friendlyError(data, fallback) {
            if (data && data.code && errorCodeMap[data.code]) return errorCodeMap[data.code];
            if (data && data.error) return data.error;
            return fallback;
        }

        new QWebChannel(qt.webChannelTransport, function(channel) {
            const bridge = channel.objects.bridge;
            attachWebsocketStatus(bridge);

            form.addEventListener("submit", function(event) {
                event.preventDefault();

                const username = document.getElementById("username").value.trim();
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirm_password").value;

                if (password !== confirmPassword) {
                    message.textContent = "驗證密碼不一致";
                    return;
                }

                const isGmail = /^[a-zA-Z0-9._%+-]+@gmail.com$/.test(email);
                if (username.length < 3) {
                    message.textContent = "帳號名稱過於簡短，請至少多於3字元";
                    return;
                }
                if (!isGmail) {
                    message.textContent = "限制Gmail進行註冊";
                    return;
                }
                if (password.length < 8) {
                    message.textContent = "密碼過於簡短，請至少多於8字元";
                    return;
                }

                button.disabled = true;
                message.textContent = "正在註冊...";

                bridge.register(username, email, password);
            });

            bridge.server_event.connect(function (payload) {
                let evt = null;
                try { evt = JSON.parse(payload); } catch (e) { evt = null; }
                if (!evt || evt.type !== "register") return;
                let data = null;
                try { data = JSON.parse(evt.result); } catch (e) { data = { ok: false, error: "伺服器回應無法解析" }; }
                button.disabled = false;
                if (data.ok) {
                    message.textContent = "註冊成功";
                    window.location.href = "index.html?registered=1";
                } else {
                    message.textContent = friendlyError(data, "註冊失敗");
                }
            });
        });
    </script>
</body>
</html>
