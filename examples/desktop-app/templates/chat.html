<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WillChat | 聊天</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #fff; color: #000; height: 100vh; }
        .layout { display: flex; height: 100vh; }
        /* 左欄：群組清單 */
        .sidebar { width: 220px; border-right: 1px solid #000; display: flex; flex-direction: column; background: #fafafa; }
        .sidebar-header { padding: 16px; border-bottom: 1px solid #000; font-weight: bold; font-size: 16px; text-align: center; }
        .group-list { flex: 1; overflow-y: auto; list-style: none; }
        .group-item { padding: 14px 16px; border-bottom: 1px solid #ddd; cursor: pointer; transition: background 0.15s ease; }
        .group-item:hover { background: #eee; }
        .group-item.active { background: #000; color: #fff; }
        .group-item .group-name { font-size: 14px; font-weight: bold; }
        .group-item .group-members { font-size: 12px; color: #888; margin-top: 2px; }
        .group-item.active .group-members { color: #ccc; }
        /* 中間：聊天區 */
        .chat { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 14px 20px; border-bottom: 1px solid #000; font-weight: bold; font-size: 16px; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 65%; padding: 10px 14px; border: 1px solid #000; border-radius: 8px; font-size: 14px; }
        .message.own { align-self: flex-end; background: #000; color: #fff; }
        .message.other { align-self: flex-start; }
        .message .meta { font-size: 11px; opacity: 0.7; margin-bottom: 4px; }
        .message.own .meta { text-align: right; }
        .chat-input { display: flex; border-top: 1px solid #000; padding: 12px; gap: 10px; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #aaa; border-radius: 4px; font-size: 14px; }
        .chat-input button { padding: 10px 20px; background: #000; color: #fff; border: 1px solid #000; border-radius: 4px; cursor: pointer; }
        .chat-input button:disabled { background: #888; border-color: #888; cursor: not-allowed; }
        .message-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #999; }
        /* 右欄：成員清單 */
        .members-panel { width: 200px; border-left: 1px solid #000; display: flex; flex-direction: column; background: #fafafa; }
        .members-header { padding: 16px; border-bottom: 1px solid #000; font-weight: bold; font-size: 16px; text-align: center; }
        .member-list { flex: 1; overflow-y: auto; list-style: none; }
        .member-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #eee; font-size: 14px; }
        .member-avatar { width: 30px; height: 30px; border-radius: 50%; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .sidebar-action { background: #000; color: #fff; border: 1px solid #000; border-radius: 4px; width: 26px; height: 26px; font-size: 16px; line-height: 1; cursor: pointer; }
        .sidebar-action:hover { background: #333; }
        .group-actions { display: flex; gap: 6px; margin-top: 6px; }
        .group-actions button { font-size: 11px; padding: 3px 8px; background: #fff; color: #000; border: 1px solid #aaa; border-radius: 3px; cursor: pointer; }
        .group-actions button:hover { background: #eee; }
        .group-item.active .group-actions button { background: #000; color: #fff; border-color: #fff; }
        .group-item.active .group-actions button:hover { background: #222; }
        #toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; background: #000; color: #fff; border-radius: 6px; font-size: 14px; opacity: 0; transform: translateY(-10px); transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none; z-index: 1000; }
        #toast.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>
    <div id="toast"></div>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header" style="display:flex;align-items:center;justify-content:space-between;">
                <span>群組</span>
                <button id="createGroupBtn" class="sidebar-action" title="新增群組">＋</button>
            </div>
            <ul class="group-list" id="groupList"></ul>
        </aside>
        <main class="chat">
            <div class="chat-header" id="chatHeader">請選擇群組</div>
            <div class="messages" id="messages">
                <div class="message-empty" id="messageEmpty">選擇左側群組開始聊天</div>
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="輸入訊息..." disabled>
                <button id="sendButton" disabled>傳送</button>
            </div>
        </main>
        <aside class="members-panel">
            <div class="members-header">成員</div>
            <ul class="member-list" id="memberList"></ul>
        </aside>
    </div>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        const currentUser = { id: "", name: "" };
        let groups = [];
        let activeGroupId = null;
        const messagesByGroup = {};

        const groupList = document.getElementById("groupList");
        const memberList = document.getElementById("memberList");
        const messagesEl = document.getElementById("messages");
        const messageEmpty = document.getElementById("messageEmpty");
        const chatHeader = document.getElementById("chatHeader");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");
        const createGroupBtn = document.getElementById("createGroupBtn");
        const toast = document.getElementById("toast");

        function showToast(text) {
            toast.textContent = text;
            toast.classList.add("visible");
            setTimeout(function () { toast.classList.remove("visible"); }, 3000);
        }

        function formatTime(ts) {
            if (!ts) return "";
            const d = new Date(Number(ts));
            const hh = d.getHours().toString().padStart(2, "0");
            const mm = d.getMinutes().toString().padStart(2, "0");
            return hh + ":" + mm;
        }

        function findGroup(id) {
            return groups.find(function (g) { return g.id === id; }) || null;
        }

        function renderGroups() {
            groupList.innerHTML = "";
            groups.forEach(function (group) {
                const li = document.createElement("li");
                li.className = "group-item";
                if (activeGroupId === group.id) li.classList.add("active");
                const name = document.createElement("div");
                name.className = "group-name";
                name.textContent = group.name;
                const count = document.createElement("div");
                count.className = "group-members";
                count.textContent = (group.members ? group.members.length : 0) + " 位成員";
                li.appendChild(name);
                li.appendChild(count);
                const actions = document.createElement("div");
                actions.className = "group-actions";
                const isOwner = group.owner_id === currentUser.id;
                const isMember = (group.members || []).some(function (m) { return m.id === currentUser.id; });
                if (isMember) {
                    const leaveBtn = document.createElement("button");
                    leaveBtn.textContent = "退出";
                    leaveBtn.addEventListener("click", function (e) { e.stopPropagation(); leaveGroup(group.id); });
                    actions.appendChild(leaveBtn);
                } else {
                    const joinBtn = document.createElement("button");
                    joinBtn.textContent = "加入";
                    joinBtn.addEventListener("click", function (e) { e.stopPropagation(); joinGroup(group.id); });
                    actions.appendChild(joinBtn);
                }
                if (isOwner) {
                    const delBtn = document.createElement("button");
                    delBtn.textContent = "刪除";
                    delBtn.addEventListener("click", function (e) { e.stopPropagation(); deleteGroup(group.id); });
                    actions.appendChild(delBtn);
                }
                li.appendChild(actions);
                li.addEventListener("click", function () { selectGroup(group.id); });
                groupList.appendChild(li);
            });
        }

        function renderMembers() {
            memberList.innerHTML = "";
            const group = findGroup(activeGroupId);
            if (!group) return;
            (group.members || []).forEach(function (member) {
                const li = document.createElement("li");
                li.className = "member-item";
                const avatar = document.createElement("span");
                avatar.className = "member-avatar";
                avatar.textContent = (member.name || "?").charAt(0);
                const name = document.createElement("span");
                name.textContent = member.name;
                li.appendChild(avatar);
                li.appendChild(name);
                memberList.appendChild(li);
            });
        }

        function renderMessages() {
            const msgs = messagesByGroup[activeGroupId] || [];
            messagesEl.innerHTML = "";
            if (msgs.length === 0) {
                messageEmpty.style.display = "flex";
                messageEmpty.textContent = "尚無訊息";
                return;
            }
            messageEmpty.style.display = "none";
            msgs.forEach(function (msg) {
                const own = msg.author_id === currentUser.id;
                const author = msg.author_name || "成員";
                const div = document.createElement("div");
                div.className = "message " + (own ? "own" : "other");
                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = (own ? currentUser.name : author) + " · " + formatTime(msg.timestamp);
                const content = document.createElement("div");
                content.textContent = msg.content;
                div.appendChild(meta);
                div.appendChild(content);
                messagesEl.appendChild(div);
            });
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        function selectGroup(id) {
            activeGroupId = id;
            const group = findGroup(id);
            chatHeader.textContent = group ? group.name : "請選擇群組";
            messageInput.disabled = !group;
            sendButton.disabled = !group;
            if (!group) {
                messagesEl.innerHTML = "";
                memberList.innerHTML = "";
                messageEmpty.style.display = "flex";
                messageEmpty.textContent = "選擇左側群組開始聊天";
                return;
            }
            renderGroups();
            renderMembers();
            loadMessages(id);
        }

        function loadMessages(groupId) {
            if (messagesByGroup[groupId]) { renderMessages(); return; }
            bridge.get_messages(groupId);
        }

        function applyState() {
            bridge.get_state(function (result) {
                let data = null;
                try { data = JSON.parse(result); } catch (e) { data = null; }
                if (!data) return;
                currentUser.id = (data.member && data.member.id) || "";
                currentUser.name = (data.member && data.member.name) || "";
                groups = data.groups || [];
                renderGroups();
                if (activeGroupId) {
                    const stillExists = findGroup(activeGroupId);
                    if (!stillExists) {
                        activeGroupId = null;
                        chatHeader.textContent = "請選擇群組";
                        messageInput.disabled = true;
                        sendButton.disabled = true;
                        messagesEl.innerHTML = "";
                        memberList.innerHTML = "";
                        messageEmpty.style.display = "flex";
                        messageEmpty.textContent = "選擇左側群組開始聊天";
                    } else {
                        renderMembers();
                        loadMessages(activeGroupId);
                    }
                }
            });
        }
        function handleEvent(evt) {
            if (evt.type === "ready") { applyState(); return; }
            if (evt.type === "message_send") {
                const gid = evt.group_id || (evt.group && evt.group.id);
                if (gid) {
                    if (!messagesByGroup[gid]) messagesByGroup[gid] = [];
                    messagesByGroup[gid].push(evt.message);
                    if (activeGroupId === gid) renderMessages();
                }
                return;
            }
            if (evt.type === "message_delete") {
                const gid = evt.group_id;
                const mid = evt.message && evt.message.id;
                if (gid && mid && messagesByGroup[gid]) {
                    messagesByGroup[gid] = messagesByGroup[gid].filter(function (m) { return m.id !== mid; });
                    if (activeGroupId === gid) renderMessages();
                }
                return;
            }
            if (evt.type === "group_create") { applyState(); return; }
            if (evt.type === "group_delete") {
                const gid = evt.group_id;
                groups = groups.filter(function (g) { return g.id !== gid; });
                delete messagesByGroup[gid];
                if (activeGroupId === gid) {
                    activeGroupId = null;
                    chatHeader.textContent = "請選擇群組";
                    messageInput.disabled = true;
                    sendButton.disabled = true;
                    messagesEl.innerHTML = "";
                    memberList.innerHTML = "";
                    messageEmpty.style.display = "flex";
                    messageEmpty.textContent = "選擇左側群組開始聊天";
                }
                renderGroups();
                return;
            }
            if (evt.type === "group_join") {
                const group = findGroup(evt.group_id);
                if (group && evt.member) {
                    if (!group.members) group.members = [];
                    group.members.push({ id: evt.member.id, name: evt.member.name });
                    renderGroups();
                    if (activeGroupId === group.id) renderMembers();
                }
                return;
            }
            if (evt.type === "group_leave") {
                const group = findGroup(evt.group_id);
                if (group && evt.member) {
                    group.members = (group.members || []).filter(function (m) { return m.id !== evt.member.id; });
                    renderGroups();
                    if (activeGroupId === group.id) renderMembers();
                }
                return;
            }
            if (evt.type === "error") { showToast(evt.message || "連線發生錯誤"); }
        }
        function promptCreateGroup() {
            const name = window.prompt("請輸入群組名稱：", "");
            if (name === null) return;
            bridge.create_group(name.trim());
        }
        function joinGroup(groupId) { bridge.join_group(groupId); }
        function leaveGroup(groupId) { bridge.leave_group(groupId); }
        function deleteGroup(groupId) {
            if (!window.confirm("確定要刪除此群組？")) return;
            bridge.delete_group(groupId);
        }
        function sendMessage() {
            if (!activeGroupId) return;
            const text = messageInput.value.trim();
            if (!text) return;
            bridge.send_message(activeGroupId, text);
            messageInput.value = "";
        }

        createGroupBtn.addEventListener("click", promptCreateGroup);
        sendButton.addEventListener("click", sendMessage);
        messageInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") sendMessage();
        });

        let bridge = null;
        new QWebChannel(qt.webChannelTransport, function (channel) {
            bridge = channel.objects.bridge;
            bridge.server_event.connect(function (payload) {
                let evt = null;
                try { evt = JSON.parse(payload); } catch (e) { evt = null; }
                if (!evt) return;
                if (evt.type === "messages") {
                    const gid = evt.group_id;
                    let data = null;
                    try { data = JSON.parse(evt.result); } catch (e) { data = null; }
                    if (gid && data && data.ok) {
                        messagesByGroup[gid] = data.messages || [];
                    } else if (gid) {
                        messagesByGroup[gid] = [];
                        if (data && data.error) showToast(data.error);
                    }
                    if (activeGroupId === gid) renderMessages();
                    return;
                }
                if (evt.type === "message_sent") {
                    let data = null;
                    try { data = JSON.parse(evt.result); } catch (e) { data = null; }
                    if (!(data && data.ok)) showToast((data && data.error) || "傳送失敗");
                    return;
                }
                if (evt.type === "group_created") {
                    let data = null;
                    try { data = JSON.parse(evt.result); } catch (e) { data = null; }
                    if (!(data && data.ok)) showToast((data && data.error) || "建立群組失敗");
                    else applyState();
                    return;
                }
                if (evt.type === "group_deleted") {
                    let data = null;
                    try { data = JSON.parse(evt.result); } catch (e) { data = null; }
                    if (!(data && data.ok)) showToast((data && data.error) || "刪除群組失敗");
                    else {
                        const gid = evt.group_id;
                        groups = groups.filter(function (g) { return g.id !== gid; });
                        delete messagesByGroup[gid];
                        if (activeGroupId === gid) {
                            activeGroupId = null;
                            chatHeader.textContent = "請選擇群組";
                            messageInput.disabled = true;
                            sendButton.disabled = true;
                            messagesEl.innerHTML = "";
                            memberList.innerHTML = "";
                            messageEmpty.style.display = "flex";
                            messageEmpty.textContent = "選擇左側群組開始聊天";
                        }
                        renderGroups();
                    }
                    return;
                }
                if (evt.type === "group_joined") {
                    let data = null;
                    try { data = JSON.parse(evt.result); } catch (e) { data = null; }
                    if (!(data && data.ok)) showToast((data && data.error) || "加入群組失敗");
                    else applyState();
                    return;
                }
                if (evt.type === "group_left") {
                    let data = null;
                    try { data = JSON.parse(evt.result); } catch (e) { data = null; }
                    if (!(data && data.ok)) showToast((data && data.error) || "退出群組失敗");
                    else {
                        const gid = evt.group_id;
                        groups = groups.filter(function (g) { return g.id !== gid; });
                        delete messagesByGroup[gid];
                        if (activeGroupId === gid) {
                            activeGroupId = null;
                            chatHeader.textContent = "請選擇群組";
                            messageInput.disabled = true;
                            sendButton.disabled = true;
                            messagesEl.innerHTML = "";
                            memberList.innerHTML = "";
                            messageEmpty.style.display = "flex";
                            messageEmpty.textContent = "選擇左側群組開始聊天";
                        }
                        renderGroups();
                    }
                    return;
                }
                handleEvent(evt);
            });
            bridge.get_state(function (result) {
                let data = null;
                try { data = JSON.parse(result); } catch (e) { data = null; }
                if (data) {
                    currentUser.id = (data.member && data.member.id) || "";
                    currentUser.name = (data.member && data.member.name) || "";
                    groups = data.groups || [];
                    renderGroups();
                }
            });
        });
    </script>
</body>
</html>
